<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f3f5f7">
    <title>Kano Home Hub</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
</head>
<body>
    <main class="app-shell" id="appShell">
        <section class="topbar">
            <div>
                <div class="eyebrow">KANO HOME HUB</div>
                <h1 id="greeting">Good afternoon</h1>
                <p class="subtitle">Your home at a glance</p>
            </div>

            <div class="time-block">
                <div id="clock" class="clock">--:--</div>
                <div id="date" class="date">---</div>
            </div>
        </section>

        <section class="status-grid">
            <button class="metric-card temperature-card" type="button">
                <div class="icon-badge icon-temperature" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><path d="M14 14.76V5a4 4 0 0 0-8 0v9.76a6 6 0 1 0 8 0ZM10 3a2 2 0 0 1 2 2v10.72l.5.3a4 4 0 1 1-5 0l.5-.3V5a2 2 0 0 1 2-2Zm-1 5h2v7.1a2.5 2.5 0 1 1-2 0V8Z"/></svg>
                </div>
                <div class="metric-copy">
                    <span class="metric-label">Temperature</span>
                    <strong class="metric-value" id="temperature">--°</strong>
                    <span class="metric-state">Sensor ready</span>
                </div>
            </button>

            <button class="metric-card humidity-card" type="button">
                <div class="icon-badge icon-humidity" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><path d="M12 2.5s7 7.03 7 12.17A7 7 0 1 1 5 14.67C5 9.53 12 2.5 12 2.5Zm0 3.08c-2.03 2.28-5 6.1-5 9.09a5 5 0 1 0 10 0c0-2.99-2.97-6.81-5-9.09Z"/></svg>
                </div>
                <div class="metric-copy">
                    <span class="metric-label">Humidity</span>
                    <strong class="metric-value" id="humidity">--%</strong>
                    <span class="metric-state">Comfort monitor</span>
                </div>
            </button>

            <button class="metric-card air-card" type="button">
                <div class="icon-badge icon-air" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><path d="M4 8h9.5a2.5 2.5 0 1 0-2.45-3h2.1A4.5 4.5 0 1 1 13.5 10H4V8Zm0 4h14a4 4 0 1 1-3.87 5h2.24A2 2 0 1 0 18 14H4v-2Zm0 4h7v2H4v-2Z"/></svg>
                </div>
                <div class="metric-copy">
                    <span class="metric-label">Air Quality</span>
                    <strong class="metric-value small-value">READY</strong>
                    <span class="metric-state">Future PM / CO₂</span>
                </div>
            </button>
        </section>

        <section class="feature-grid">
            <button class="feature-card weather-card" type="button">
                <div class="feature-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><path d="M7 18a5 5 0 0 1-.7-9.95A6.5 6.5 0 0 1 18.64 9.5 4.25 4.25 0 0 1 18.75 18H7Zm0-2h11.75a2.25 2.25 0 1 0-.95-4.29l-1.22.57-.19-1.33A4.5 4.5 0 0 0 7.4 10l-.1.01-.95.11A3 3 0 0 0 7 16ZM5 4h2v2H5V4Zm-3 5h3v2H2V9Zm4.93-4.49 1.42-1.42 1.4 1.4L8.34 5.91 6.93 4.51Z"/></svg>
                </div>
                <div>
                    <span class="feature-kicker">OUTSIDE</span>
                    <strong>Weather</strong>
                    <span class="feature-detail">Forecast & alerts</span>
                </div>
            </button>

            <button class="feature-card" type="button">
                <div class="feature-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><path d="M7 2h2v2h6V2h2v2h3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h3V2Zm13 8H4v10h16V10ZM4 8h16V6h-3v1h-2V6H9v1H7V6H4v2Z"/></svg>
                </div>
                <div>
                    <span class="feature-kicker">TODAY</span>
                    <strong>Calendar</strong>
                    <span class="feature-detail">Family schedule</span>
                </div>
            </button>

            <button class="feature-card" type="button">
                <div class="feature-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><path d="m9 16.17-3.59-3.58L4 14l5 5L20 8l-1.41-1.41L9 16.17Z"/></svg>
                </div>
                <div>
                    <span class="feature-kicker">FOCUS</span>
                    <strong>To‑Do</strong>
                    <span class="feature-detail">Tasks & reminders</span>
                </div>
            </button>

            <button class="feature-card" type="button">
                <div class="feature-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><path d="M15 1H9v2h6V1Zm-1 13h-2V8h2v6Zm3.03-7.03 1.42-1.42A10 10 0 1 1 5.55 5.55l1.42 1.42A8 8 0 1 0 17.03 6.97Z"/></svg>
                </div>
                <div>
                    <span class="feature-kicker">TOOLS</span>
                    <strong>Timer</strong>
                    <span class="feature-detail">Quick countdowns</span>
                </div>
            </button>

            <button class="feature-card" id="photosButton" type="button">
                <div class="feature-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><path d="M21 19V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2ZM5 5h14v9.1l-3.5-3.5-4.5 4.5-2-2L5 17.1V5Zm14 14H6.41L9 16.41l2 2 4.5-4.5 3.5 3.5V19ZM8.5 10A1.5 1.5 0 1 0 8.5 7a1.5 1.5 0 0 0 0 3Z"/></svg>
                </div>
                <div>
                    <span class="feature-kicker">MEMORIES</span>
                    <strong>Photos</strong>
                    <span class="feature-detail">Family slideshow</span>
                </div>
            </button>

            <button class="feature-card" type="button">
                <div class="feature-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><path d="M12 2a2 2 0 0 1 2 2v1.1a7 7 0 0 1 2.5 1.04l.78-.78a2 2 0 1 1 2.83 2.83l-.78.78A7 7 0 0 1 20.38 11H22a2 2 0 1 1 0 4h-1.62a7 7 0 0 1-1.05 2.03l.78.78a2 2 0 1 1-2.83 2.83l-.78-.78A7 7 0 0 1 14 20.9V22a2 2 0 1 1-4 0v-1.1a7 7 0 0 1-2.5-1.04l-.78.78a2 2 0 1 1-2.83-2.83l.78-.78A7 7 0 0 1 3.62 15H2a2 2 0 1 1 0-4h1.62a7 7 0 0 1 1.05-2.03l-.78-.78a2 2 0 1 1 2.83-2.83l.78.78A7 7 0 0 1 10 5.1V4a2 2 0 0 1 2-2Zm0 5a5 5 0 1 0 0 10 5 5 0 0 0 0-10Zm0 3a2 2 0 1 1 0 4 2 2 0 0 1 0-4Z"/></svg>
                </div>
                <div>
                    <span class="feature-kicker">SYSTEM</span>
                    <strong>Settings</strong>
                    <span class="feature-detail">Hub preferences</span>
                </div>
            </button>
        </section>

        <nav class="bottom-nav" aria-label="Primary">
            <button class="nav-item active" type="button">
                <svg viewBox="0 0 24 24"><path d="m12 3 9 8h-3v9h-5v-6h-2v6H6v-9H3l9-8Z"/></svg>
                <span>Home</span>
            </button>
            <button class="nav-item" type="button">
                <svg viewBox="0 0 24 24"><path d="M12 4a8 8 0 1 1 0 16 8 8 0 0 1 0-16Zm0 2a6 6 0 1 0 0 12 6 6 0 0 0 0-12Z"/></svg>
                <span>Weather</span>
            </button>
            <button class="nav-item" type="button">
                <svg viewBox="0 0 24 24"><path d="M5 4h14a2 2 0 0 1 2 2v14H3V6a2 2 0 0 1 2-2Zm0 5v9h14V9H5Z"/></svg>
                <span>Calendar</span>
            </button>
            <button class="nav-item" type="button">
                <svg viewBox="0 0 24 24"><path d="M9 17 4 12l1.4-1.4L9 14.2 18.6 4.6 20 6 9 17Z"/></svg>
                <span>Tasks</span>
            </button>
            <button class="nav-item" type="button">
                <svg viewBox="0 0 24 24"><path d="M8 5h8l3 4v8a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V9l3-4Zm1 2L7 10h10l-2-3H9Z"/></svg>
                <span>Robot</span>
            </button>
        </nav>
        <div class="signature">alan@kit</div>
    </main>

    <section class="screensaver" id="screensaver" aria-hidden="true">
        <img id="screensaverImage" alt="Family photo">
        <div class="screensaver-shade"></div>
        <div class="screensaver-clock">
            <div id="screensaverTime">--:--</div>
            <div id="screensaverDate">---</div>
        </div>
        <div class="screensaver-hint">Touch anywhere to return home</div>
    </section>

    <script id="photoData" type="application/json">{{ photos | tojson }}</script>
    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
</body>
</html>
