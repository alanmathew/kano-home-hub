<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>Kano Home Hub</title>

<style>
body {
    margin: 0;
    background: #10151c;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

header {
    padding: 25px 35px;
    display: flex;
    justify-content: space-between;
}

#clock {
    font-size: 42px;
    font-weight: bold;
}

#date {
    font-size: 20px;
    opacity: .7;
}

.grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    padding: 20px 35px;
}

.card {
    background: #202833;
    border-radius: 18px;
    padding: 25px;
    min-height: 90px;
}

.value {
    font-size: 34px;
    font-weight: bold;
}

.label {
    opacity: .65;
    margin-top: 8px;
}

button {
    background: #202833;
    color: white;
    border: 0;
    border-radius: 15px;
    padding: 20px;
    font-size: 20px;
}

#photos {
    display: none;
    position: fixed;
    inset: 0;
    background: black;
    z-index: 100;
}

#photo {
    width: 100%;
    height: 100%;
    object-fit: contain;
}
</style>
</head>

<body>

<header>
<div>
    <div id="clock"></div>
    <div id="date"></div>
</div>

<div>
    KANO HOME HUB
</div>
</header>

<div class="grid">

<div class="card">
<div class="value">-- °F</div>
<div class="label">Indoor Temperature</div>
</div>

<div class="card">
<div class="value">-- %</div>
<div class="label">Humidity</div>
</div>

<div class="card">
<div class="value">--</div>
<div class="label">Air Quality</div>
</div>

<button>🌤 Weather</button>
<button>📅 Calendar</button>
<button>✓ To-Do</button>

<button>⏱ Timer</button>
<button onclick="startPhotos()">🖼 Photos</button>
<button>⚙ Settings</button>

</div>


<div id="photos">
<img id="photo">
</div>


<script>

function updateClock() {
    const now = new Date();

    document.getElementById("clock").textContent =
        now.toLocaleTimeString([], {
            hour: "2-digit",
            minute: "2-digit"
        });

    document.getElementById("date").textContent =
        now.toLocaleDateString([], {
            weekday: "long",
            month: "long",
            day: "numeric"
        });
}

updateClock();
setInterval(updateClock,1000);


const photos = [
{% for photo in photos %}
"/static/photos/family/{{ photo }}",
{% endfor %}
];

let photoIndex = 0;
let photoTimer;
let idleTimer;


function showPhoto() {

    if (!photos.length) return;

    document.getElementById("photo").src =
        photos[photoIndex];

    photoIndex =
        (photoIndex + 1) % photos.length;
}


function startPhotos() {

    if (!photos.length) return;

    document.getElementById("photos").style.display =
        "block";

    showPhoto();

    photoTimer =
        setInterval(showPhoto,15000);
}


function stopPhotos() {

    document.getElementById("photos").style.display =
        "none";

    clearInterval(photoTimer);

    resetIdle();
}


function resetIdle() {

    clearTimeout(idleTimer);

    idleTimer =
        setTimeout(startPhotos,180000);
}


["touchstart","mousedown","keydown"].forEach(event => {

    document.addEventListener(event, () => {

        if (
            document.getElementById("photos")
                    .style.display === "block"
        ) {
            stopPhotos();
        }

        else {
            resetIdle();
        }

    });

});


resetIdle();

</script>

</body>
</html>
